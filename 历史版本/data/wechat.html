  background:rgba(226,59,46,.94); border-radius:8px; box-shadow:0 6px 18px rgba(226,59,46,.45);
  font-family:"Microsoft YaHei",sans-serif; pointer-events:none; z-index:6; }
#gBoard .ch-check { box-shadow:0 0 0 4px #E23B2E inset, 0 0 14px rgba(226,59,46,.85); animation:chPulse .7s infinite alternate; }
@keyframes chPulse { from { box-shadow:0 0 0 3px #E23B2E inset, 0 0 8px rgba(226,59,46,.6); } to { box-shadow:0 0 0 5px #E23B2E inset, 0 0 18px rgba(226,59,46,1); } }
#gBtns button:hover { background:#F2F2F2; }#gStage { position:relative; }
#gStage #gBoard { margin:0 auto; }
.gRow { text-align:center; margin:2px 0; }
.gRow .gAva { display:inline-block; vertical-align:middle; }
.gRow .gBub { display:inline-block; vertical-align:middle; margin:0 0 0 9px; max-width:320px; text-align:left; }
.gAva { width:44px; height:44px; margin:0 auto; border-radius:6px; background:#3E9E6A; color:#fff; font-size:16px; line-height:44px; background-size:cover; background-position:center; overflow:hidden; }
.gBub { position:relative; margin-bottom:7px; padding:7px 9px; background:#fff; border:1px solid #E2E2E2; border-radius:8px; font-size:12px; line-height:1.45; color:#333; text-align:left; box-shadow:0 1px 3px rgba(0,0,0,.08); opacity:0; visibility:hidden; transform:translateY(5px) scale(.94); transition:opacity .18s ease-out, transform .18s ease-out, visibility .18s; word-break:break-all; }
.gBub.on { opacity:1; visibility:visible; transform:none; }
.gBub:after { content:''; position:absolute; left:-5px; top:15px; width:9px; height:9px; background:#fff; border-left:1px solid #E2E2E2; border-bottom:1px solid #E2E2E2; transform:rotate(45deg); }
.gRow .gBub { margin-left:9px; }
#gResult { position:absolute; left:0; top:0; right:0; bottom:0; z-index:70; display:none; background:rgba(255,255,255,.72); cursor:pointer; }
#gResult #gResultText { position:absolute; left:0; right:0; top:50%; margin-top:-60px; text-align:center; font-size:110px; line-height:120px; font-weight:bold; letter-spacing:8px; font-family:"Arial Black","Microsoft YaHei",sans-serif; opacity:0; transform:scale(.6); transition:opacity .25s ease-out, transform .25s ease-out; }
#gResult.show #gResultText { opacity:1; transform:scale(1); }
#gResult.red #gResultText { color:#E23B2E; text-shadow:0 8px 26px rgba(226,59,46,.35); }
#gResult.gray #gResultText { color:#9A9A9A; text-shadow:0 8px 26px rgba(0,0,0,.18); }
#gResult.black #gResultText { color:#1A1A1A; text-shadow:0 8px 26px rgba(0,0,0,.25); }#gInvite { position:fixed; left:0; top:0; right:0; bottom:0; z-index:88; display:none; background:rgba(0,0,0,.28); }
#gInvite .gInvBox { position:absolute; left:50%; top:50%; width:300px; margin-left:-150px; margin-top:-110px; background:#fff; border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,.25); padding:18px 18px 14px; font-family:"Microsoft YaHei",sans-serif; }
#gInvite .gInvHead { text-align:center; margin-bottom:10px; }
#gInvite .gInvAva { width:56px; height:56px; margin:0 auto 6px; border-radius:8px; background:#3E9E6A; background-size:cover; background-position:center; color:#fff; font-size:20px; line-height:56px; text-align:center; }
#gInvite .gInvName { font-size:14px; color:#333; font-weight:bold; }
#gInvite .gInvText { font-size:13px; color:#555; line-height:1.6; text-align:center; margin-bottom:16px; min-height:40px; }
#gInvite .gInvBtns { text-align:center; }
#gInvite button { height:34px; padding:0 20px; margin:0 6px; font-size:13px; border-radius:6px; cursor:pointer; font-family:"Microsoft YaHei",sans-serif; }
#gInvite .gInvNo { background:#F2F2F2; color:#555; border:1px solid #E0E0E0; }
#gInvite .gInvYes { background:#07C160; color:#fff; border:1px solid #07C160; }#gBoard .sq-l { background:#EFD9B4; }
#gBoard .sq-d { background:#B58863; }
#gBoard .pc-white { color:#FFFFFF; text-shadow:0 0 2px #2B2B2B, 0 1px 1px #2B2B2B; }
#gBoard .pc-black { color:#1F1F1F; text-shadow:0 0 1px rgba(255,255,255,.55); }
#gBoard .ch-sel { box-shadow:0 0 0 3px rgba(7,193,96,.75) inset; }
#gBoard .ch-last { box-shadow:0 0 0 3px rgba(240,162,32,.8) inset; }#gSayRow { padding:6px 0 0 8px; text-align:left; }
.gBub.typing { color:#9A9A9A; font-style:italic; }
.gFirst { color:#07C160; margin-left:4px; }
#gSay { width:200px; height:28px; border:1px solid #DADADA; border-radius:4px; padding:0 8px; font-size:13px; font-family:"Microsoft YaHei",sans-serif; outline:none; }
#gSayRow button { height:30px; margin-left:6px; padding:0 12px; font-size:13px; background:#07C160; color:#fff; border:0; border-radius:4px; cursor:pointer; font-family:"Microsoft YaHei",sans-serif; }</style>
</head>
<body>
<div id="app">
  <div id="rail">
    <div class="ritem on" id="railChat" title="聊天" onclick="setListMode('chat')">
      <svg viewBox="0 0 24 24"><path d="M5 4.5h14a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-7.2L7 21v-3.8H5a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2z"/></svg>
    </div>
    <div class="ritem" id="railContacts" title="通讯录" onclick="setListMode('contacts')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.6 20.4v-1.1c0-3.1 2.5-5.6 5.6-5.6h3.6c3.1 0 5.6 2.5 5.6 5.6v1.1"/></svg>
    </div>
    <div class="ritem" id="railMoments" title="朋友圈" onclick="openMoments()">
      <svg viewBox="0 0 24 24"><rect x="3.6" y="3.6" width="16.8" height="16.8" rx="4"/><circle cx="8.7" cy="8.7" r="1.5"/><path d="M4.6 16.6l4.5-4.5 3.4 3.4 2.5-2.5 4.4 4.4"/></svg>
    </div>
    <div class="ritem" id="railGames" title="游戏" onclick="openGames()">
      <svg viewBox="0 0 24 24"><rect x="2.8" y="6.6" width="18.4" height="11" rx="5.2"/><path d="M8 10.2v3.6M6.2 12h3.6"/><circle cx="15.6" cy="11" r="1"/><circle cx="17.8" cy="13.4" r="1"/></svg>
    </div>
  </div>
  <div id="sidebar">
    <div id="sideHead">
      <div id="meAvatar" title="小条">条</div>
      <div id="searchWrap"><input id="searchInput" placeholder="搜索" oninput="filterContacts()" /></div>
      <div id="plusBtn" onclick="togglePlus()">+</div>
      <div id="plusMenu">
        <div onclick="openGroupDlg()">发起群聊</div>
        <div onclick="showAdd()">添加朋友</div>
      </div>
    </div>
    <div id="contacts"></div>
  </div>
  <div id="main">
    <div id="topbar">
      <div class="tb-title"><div class="name" id="chatName">结城梨斗</div><div class="status" id="status">在线</div></div>
      <div class="mem-btn" onclick="togglePanel()">记忆</div>
    </div>
    <div id="chat"></div>
    <div id="typing">对方正在输入…</div>
    <div id="inputbar">
      <textarea id="input"></textarea>
      <div id="toolbar">
        <button id="emojiBtn" onclick="toggleEmoji()">☺</button>
        <button id="sendBtn" onclick="doSend()">发送</button>
      </div>
    </div>
    <div id="epanel"><div id="egrid"></div></div>
  </div>
  <div id="moments">
    <div id="mHead"><span class="mback" onclick="closeMoments()">&#8249;</span>朋友圈<span class="mpost" onclick="openMomentDlg()">发表</span></div>
    <div id="mFeed"></div>
  </div>
  <div id="panel">
    <div class="panel-head">记忆库<span class="close" onclick="togglePanel()">&#215;</span></div>
    <div class="mem-list" id="memList"></div>
  </div>
  <div class="overlay" id="overlay">
    <div class="dialog">
      <div class="dlg-title">要永久记住这件事吗？</div>
      <div class="dlg-text" id="dlgText"></div>
      <div class="dlg-btns">
        <button class="btn-gray" onclick="confirmNo()">算了</button>
        <button class="btn-green" onclick="confirmYes()">记住</button>
      </div>
    </div>
  </div>
  <div class="overlay" id="addOverlay">
    <div class="dialog">
      <div class="dlg-title">添加朋友</div>
      <input id="newName" placeholder="名字，比如 古手川唯" />
      <textarea id="newPrompt" placeholder="人设：第一人称，她是谁、性格、怎么说话"></textarea>
      <div class="dlg-btns">
        <button class="btn-gray" onclick="hideAdd()">取消</button>
        <button class="btn-green" onclick="submitAdd()">添加</button>
      </div>
    </div>
  </div>
  <div class="overlay" id="groupOverlay">
    <div class="dialog">
      <div class="dlg-title">发起群聊</div>
      <div class="dlg-text" id="groupList"></div>
      <input id="groupName" placeholder="群聊名称（不填就按成员自动起）" />
      <div class="dlg-btns">
        <button class="btn-gray" onclick="hideGroup()">取消</button>
        <button class="btn-green" onclick="submitGroup()">创建</button>
      </div>
    </div>
  </div>
  <div class="overlay" id="momentOverlay">
    <div class="dialog">
      <div class="dlg-title">发表朋友圈</div>
      <textarea id="momentText" placeholder="这一刻的想法…"></textarea>
      <div class="dlg-btns">
        <button class="btn-gray" onclick="hideMomentDlg()">取消</button>
        <button class="btn-green" onclick="submitMoment()">发表</button>
      </div>
    </div>
  </div>  <div id="games">
    <div id="gResult" onclick="hideResult()"><div id="gResultText"></div></div>
    <div id="gHead"><span class="mback" onclick="closeGames()">&#8249;</span>游戏<span id="gTitle"></span></div>
    <div id="gTabs">
      <span class="gtab on" data-g="gomoku" onclick="pickGame('gomoku')">五子棋</span>
      <span class="gtab" data-g="chess" onclick="pickGame('chess')">国际象棋</span>
      <span class="gtab" data-g="go" onclick="pickGame('go')">围棋</span>
      <span class="gtab" data-g="flight" onclick="pickGame('flight')">飞行棋</span>
    </div>
    <div id="gPick">
      <div class="gTip">选个对手（★ 越多越难）</div>
      <div id="gList"></div>
    </div>
    <div id="gPlay">
      <div id="gInfo"></div>
      <div id="gStage">
        <div class="gRow gNorth"><div class="gAva" id="gAvaOpp"></div><div class="gBub" id="gBubOpp"></div></div>
        <div id="gBoard"></div>
        <div class="gRow gSouth"><div class="gAva" id="gAvaMe">条</div><div class="gBub" id="gBubMe"></div></div>
      </div>
      <div id="gSayRow"><input id="gSay" type="text" placeholder="边下边聊…" onkeydown="gSayKey(event)" /><button onclick="gSaySend()">发送</button></div>
      <div id="gBtns">
        <div id="gDice" onclick="gRoll()" title="点我掷骰子"></div>
        <button id="gRoll" onclick="gRoll()">掷骰子</button>
        <button id="gPass" onclick="gPass()">停一手</button>
        <button id="gAgain" onclick="gAgain()">再来一次</button>
        <button onclick="gUndo()">悔棋</button>
        <button id="gGiveUp" onclick="gGiveUp()">认输</button>
        <button onclick="gBack()">换对手</button>
      </div>
    </div>
  </div>  <div id="gInvite">
    <div class="gInvBox">
      <div class="gInvHead"><div class="gInvAva" id="gInvAva"></div><div class="gInvName" id="gInvName"></div></div>
      <div class="gInvText" id="gInvText"></div>
      <div class="gInvBtns">
        <button class="gInvNo" onclick="declineInvite()">下次吧</button>
        <button class="gInvYes" onclick="acceptInvite()">来一局</button>
      </div>
    </div>
  </div>  <div id="chatCtx"></div>
  <div id="toast"></div>
</div>

  var colors = ['#7A8B99','#B08968','#6D8B74','#8A6E9E','#5B7DB1','#B07D62','#7C8C4E'];
  var h = 0;
  for (var i=0;i<s.length;i++) h += s.charCodeAt(i);
  return colors[h % colors.length];
}

function renderCharacters(json){
  contactsData = JSON.parse(json || '[]');
  drawContacts();
}

var contactsData = [];
var contactKeyword = '';
var listMode = 'chat';

function setListMode(m){
  listMode = m;
  el('railChat').className = 'ritem' + (m === 'chat' ? ' on' : '');
  el('railContacts').className = 'ritem' + (m === 'contacts' ? ' on' : '');
  contactKeyword = '';
  var inp = el('searchInput');
  if (inp) {
    inp.value = '';
    inp.placeholder = (m === 'contacts') ? '搜索联系人' : '搜索';
  }
  drawContacts();
}

function filterContacts(){
  var inp = el('searchInput');
  contactKeyword = inp ? inp.value.replace(/^\s+|\s+$/g, '') : '';
  drawContacts();
}

function delContact(id, name){
  if (!confirm('删除联系人「' + name + '」？\n只从列表里移除，聊天记录文件会保留。')) return;
  window.external.DeleteCharacter(id);
}

// 通讯录：按拼音首字母排序 + 分节，非内置联系人可删除
function drawAddressBook(box){
  var kw = contactKeyword;
  var people = [];
  for (var i=0;i<contactsData.length;i++){
    var c = contactsData[i];
    if (c.group) continue;
    if (kw && (c.name || '').indexOf(kw) < 0) continue;
    people.push(c);
  }
  people.sort(function(a, b){
    var pa = a.py || '#', pb = b.py || '#';
    if (pa !== pb) return pa < pb ? -1 : 1;
    var na = a.name || '', nb = b.name || '';
    return na < nb ? -1 : (na === nb ? 0 : 1);
  });

  var add = document.createElement('div');
  add.className = 'abAdd';
  add.innerHTML = '<span class="abPlus">+</span> 添加朋友';
  add.onclick = function(){ showAdd(); };
  box.appendChild(add);

  var lastPy = null;
  for (var j=0;j<people.length;j++){
    var p = people[j];
    var py = p.py || '#';
    if (py !== lastPy) {
      var head = document.createElement('div');
      head.className = 'abHead';
      head.innerText = py;
      box.appendChild(head);
      lastPy = py;
    }
    var row = document.createElement('div');
    row.className = 'abRow';
    row.onclick = (function(id){ return function(){ window.external.SwitchChat(id); }; })(p.id);
    var av = document.createElement('div');
    av.className = 'cavatar';
    if (AVATARS[p.avatar]) {
      av.style.backgroundImage = "url('" + AVATARS[p.avatar] + "')";
      av.style.backgroundSize = 'cover';
      av.style.backgroundPosition = '50% 50%';
      av.style.backgroundRepeat = 'no-repeat';
    } else {
      av.innerText = (p.name || '?').charAt(0);
      av.style.background = colorFor(p.name || '?');
    }
    var nm = document.createElement('div');
    nm.className = 'abName';
    nm.innerText = p.name || '';
    row.appendChild(av);
    row.appendChild(nm);
    if (!p.builtin) {
      var del = document.createElement('div');
      del.className = 'abDel';
      del.innerText = '删除';
      del.onclick = (function(id, name){
        return function(ev){
          if (ev) { ev.cancelBubble = true; if (ev.stopPropagation) ev.stopPropagation(); }
          delContact(id, name);
        };
      })(p.id, p.name);
      row.appendChild(del);
    }
    box.appendChild(row);
  }
  if (people.length === 0) {
    var empty = document.createElement('div');
    empty.className = 'abEmpty';
    empty.innerText = kw ? '没有匹配的联系人' : '还没有联系人';
    box.appendChild(empty);
  }
}

// ---- 聊天列表右键：置顶 / 取消置顶 ----
var ctxChatId = null;

function showChatCtx(ev, id, pinned){
  // 也允许直接传 id（测试/预览用）
  if (typeof ev === 'string') { pinned = id; id = ev; ev = null; }
  ev = ev || window.event;
  if (ev) {
    if (ev.preventDefault) ev.preventDefault();
    if (ev.stopPropagation) ev.stopPropagation();
    ev.cancelBubble = true;
  }
  ctxChatId = id;
  var m = el('chatCtx');
  if (!m) return false;
  m.innerHTML = '<div onclick="applyPin(' + (pinned ? 'false' : 'true') + ')">' + (pinned ? '取消置顶' : '置顶该聊天') + '</div>';
  var x = ev && ev.clientX ? ev.clientX : 200;
  var y = ev && ev.clientY ? ev.clientY : 200;
  m.style.left = x + 'px';
  m.style.top = y + 'px';
  m.style.display = 'block';
  return false;
}

function hideChatCtx(){
  var m = el('chatCtx');
  if (m) m.style.display = 'none';
  ctxChatId = null;
}

function applyPin(pin){
  var id = ctxChatId;
  hideChatCtx();
  if (id) window.external.PinChat(id, pin);
}

function drawContacts(){
  var box = el('contacts');
  box.innerHTML = '';
  if (listMode === 'contacts') { drawAddressBook(box); return; }
  var list = contactsData;
  var kw = contactKeyword;
  var activeRow = null;
  for (var i=0;i<list.length;i++){
    var c = list[i];
    if (kw && (c.name || '').indexOf(kw) < 0) continue;
    var row = document.createElement('div');
    row.className = 'contact' + (c.active ? ' active' : '') + (c.pinned ? ' pinned' : '');
    row.onclick = (function(id){ return function(){ window.external.SwitchChat(id); }; })(c.id);
    row.oncontextmenu = (function(id, pinned){ return function(ev){ return showChatCtx(ev, id, pinned); }; })(c.id, c.pinned);
    var av = document.createElement('div');
    av.className = 'cavatar';
    if (AVATARS[c.avatar]) {
      av.style.backgroundImage = "url('" + AVATARS[c.avatar] + "')";
      av.style.backgroundSize = "cover";
      av.style.backgroundPosition = "50% 50%";
      av.style.backgroundRepeat = "no-repeat";
    } else {
      av.innerText = c.group ? '群' : c.name.charAt(0);
      av.style.background = colorFor(c.name);
    }
    var avWrap = document.createElement('div');
    avWrap.className = 'avatar-wrap';
    avWrap.appendChild(av);
    if (c.unread) {
      var bd = document.createElement('div');
      bd.className = 'badge';
      avWrap.appendChild(bd);
    }
    var info = document.createElement('div');
    info.className = 'cinfo';
    var nm = document.createElement('div');
    nm.className = 'cname'; nm.innerText = c.name;
    var sn = document.createElement('div');
    sn.className = 'csnippet'; sn.innerText = c.last || '';
    info.appendChild(nm); info.appendChild(sn);
    var tm = document.createElement('div');
    tm.className = 'ctime'; tm.innerText = c.time || '';
    row.appendChild(avWrap); row.appendChild(info); row.appendChild(tm);
    box.appendChild(row);
    if (c.active) activeRow = row;
  }
  if (activeRow && activeId !== lastScrolledId) {
    var box2 = el('contacts');
    var rr = activeRow.getBoundingClientRect();
    var bb = box2.getBoundingClientRect();
    if (rr.top < bb.top) activeRow.scrollIntoView(true);
    else if (rr.bottom > bb.bottom) activeRow.scrollIntoView(false);
    lastScrolledId = activeId;
  }
}

// ---- 拍一拍：双击角色头像 ----
var gLastPat = 0;
function patPat(id, name){
  id = id || activeId;
  name = name || activeName || 'TA';
  if (!id) return;
  var now = new Date().getTime();
  if (now - gLastPat < 700) return;          // 防手抖连击
  gLastPat = now;
  addPatLine('你拍了拍 <b>' + esc(name) + '</b>');
  if (window.external && window.external.PatChat) window.external.PatChat(id);
}
// 拍一拍的灰字提示（不是普通消息，不进聊天记录）
function addPatLine(html){
  var chat = el('chat');
  if (!chat) return;
  var row = document.createElement('div');
  row.className = 'patline';
  row.innerHTML = html;
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}
function addMessage(role, text){
  var chat = el('chat');
  var row = document.createElement('div');
  row.className = 'row ' + (role === 'user' ? 'right' : 'left');
  var av = document.createElement('div');
  av.className = 'avatar';
  if (role !== 'user') {
    av.ondblclick = function () { patPat(activeId, activeName); };
    av.title = '双击拍一拍';
  }
  if (role === 'user') {
    av.className += ' av-me';
    av.innerText = '条';
  } else {
    av.className += ' av-him';
    if (AVATARS[activeAvatar]) {
      av.style.backgroundImage = "url('" + AVATARS[activeAvatar] + "')";
      av.style.backgroundSize = "cover";
      av.style.backgroundPosition = "50% 50%";
      av.style.backgroundRepeat = "no-repeat";
    } else {
      av.innerText = activeName.charAt(0);
      av.style.background = colorFor(activeName);
    }
  }
  var wrap = document.createElement('div');
  wrap.className = 'bwrap';
  var b = document.createElement('div');
  b.className = 'bubble ' + (role === 'user' ? 'me' : 'him');
  b.innerText = text;
  wrap.appendChild(b);
  row.appendChild(av); row.appendChild(wrap);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function setTyping(on){ el('typing').style.display = on ? 'block' : 'none'; }

function setBusy(on){
  busy = on;
  if (!on) sending = false;
  el('sendBtn').disabled = on;
  updateSendState();
}

function setInput(t){ el('input').value = t; doSend(); }

function doSend(){
  if (busy) { showToast('等对方回完这句再发'); return; }
  if (sending) return;
  var t = el('input').value;
  if (!t || !t.replace(/\s/g,'')) return;
  sending = true;
  setTimeout(function(){ sending = false; }, 1200);
  el('input').value = '';
  updateSendState();
  window.external.Send(t);
}

// 输入框没内容时「发送」是灰的（微信就是这样）
function updateSendState(){
  var t = el('input');
  var btn = el('sendBtn');
  if (!btn) return;
  var empty = !t || !t.value || !t.value.replace(/\s/g, '');
  btn.className = (empty || busy) ? 'disabled' : '';
}

function onEnter(e){ if (e.keyCode === 13 && !e.shiftKey) { e.preventDefault(); doSend(); } }

function renderMemories(json){

  if (!memData.length) { list.innerHTML = '<div style="color:#B2B2B2;font-size:12px;text-align:center;padding:30px 0;">还没有记忆</div>'; return; }
  for (var i=0;i<memData.length;i++){
    var m = memData[i];

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function avatarHtml(name, avatar){
  if (avatar === 'me') return '<div class="mavatar" style="background:#3E9E6A">条</div>';
  var img = AVATARS[avatar];
  if (img) return '<div class="mavatar" style="background-image:url(\'' + img + '\')"></div>';
  return '<div class="mavatar" style="background:' + colorFor(name) + '">' + esc((name||'?').charAt(0)) + '</div>';
}
function timeAgo(ts){
  if (!ts) return '';
  var d = Date.now() - ts;
  var min = Math.floor(d / 60000);
  if (min < 1) return '刚刚';
  if (min < 60) return min + '分钟前';
  var h = Math.floor(min / 60);
  if (h < 24) return h + '小时前';
  var dt = new Date(ts);
  if (h < 48) return '昨天';
  return (dt.getMonth()+1) + '月' + dt.getDate() + '日';
}
function toggleComment(id){
  var b = el('mib_' + id);
  if (!b) return;
  if (b.style.display === 'block') { b.style.display = 'none'; return; }
  b.style.display = 'block';
  var i = el('mc_' + id);
  if (i) i.focus();
}
function renderMoments(json){
  var list = JSON.parse(json || '[]');
  var feed = el('mFeed');
  var html = '<div class="mcover"><div class="mcoverName">小条</div><div class="mcoverAvatar">条</div></div>';
  if (!list.length) {
    html += '<div class="mloading">今天还没有人发动态，晚点再来看看～</div>';
    feed.innerHTML = html;
    return;
  }
  for (var i=0;i<list.length;i++){
    var m = list[i];
    html += '<div class="mcard">' + avatarHtml(m.name, m.avatar) + '<div class="mbody">';
    html += '<div class="mname">' + esc(m.name) + '</div>';
    html += '<div class="mtext">' + esc(m.text) + '</div>';
    html += '<div class="mtime">' + timeAgo(m.ts) + '</div>';
    var hasLikes = !!m.likeNames;
    var hasComments = !!(m.comments && m.comments.length);
    html += '<div class="mbox" id="mbx_' + m.id + '"' + ((hasLikes || hasComments) ? '' : ' style="display:none"') + '>';
    html += '<div class="mline" id="mll_' + m.id + '" style="color:#576B95' + (hasLikes ? '' : ';display:none') + '">' + (hasLikes ? '<span class="heart">♥</span>' + esc(m.likeNames) : '') + '</div>';
    html += '<div class="split" id="msp_' + m.id + '" style="display:' + ((hasLikes && hasComments) ? 'block' : 'none') + '"></div>';
    html += '<div id="mcm_' + m.id + '">';
    if (hasComments) {
      for (var j=0;j<m.comments.length;j++){
        var c = m.comments[j];
        html += '<div class="mline"><span class="cname">' + esc(c.name) + '：</span>' + esc(c.text) + '</div>';
      }
    }
    html += '</div></div>';
    html += '</div>';
    html += '<div class="mact" onclick="toggleOp(\'' + m.id + '\')">••</div>';
    html += '<div class="mop" id="mop_' + m.id + '">' +
            (m.mine ? '' : '<div id="mlk_' + m.id + '" onclick="likeMoment(\'' + m.id + '\')">' + (m.liked ? '取消' : '赞') + '</div>') +
            '<div onclick="commentOp(\'' + m.id + '\')">评论</div></div>';
    html += '<div class="minput" id="mib_' + m.id + '"><input id="mc_' + m.id + '" placeholder="评论" /><button onclick="commentMoment(\'' + m.id + '\')">发送</button></div>';
    html += '</div>';
  }
  feed.innerHTML = html;
}
function commentMoment(id){
  var inp = el('mc_' + id);
  if (!inp) return;
  var t = inp.value;
  if (!t || !t.replace(/\s/g,'')) return;
  inp.value = '';
  window.external.CommentMoment(id, t);
  showToast('已留言，等 TA 回你一句…');
}

function toggleOp(id){

<script>

(function (root) {

  // 某点对 p 的进攻/防守价值

          if (nx < 0 || nx >= GO_SIZE || ny < 0 || ny >= GO_SIZE) break;
          if (b[ny * GO_SIZE + nx] === p) cnt++;
          else { if (b[ny * GO_SIZE + nx] === 0) open++; break; }
        }

      if (cnt >= 5) val = 100000;
      else if (cnt === 4 && open >= 1) val = 10000;
      else if (cnt === 3 && open >= 2) val = 1000;
      else if (cnt === 3 && open === 1) val = 200;
      else if (cnt === 2 && open >= 2) val = 60;
      else if (cnt === 2 && open === 1) val = 15;
      else if (cnt === 1 && open >= 2) val = 4;

    click: function (s, idx) {

  function chNew() {

      castle: { wk: true, wq: true, bk: true, bq: true } };
  }
  function chIdx(x, y) { return y * CH_N + x; }
  function chAt(s, x, y) {
    if (x < 0 || x > 7 || y < 0 || y > 7) return null;
    return s.b[y * CH_N + x];
  }
  function chIsWhite(p) { return p >= 'A' && p <= 'Z'; }
  function chOwner(p) { return p ? (chIsWhite(p) ? 1 : 2) : 0; }
  function chCopy(s) {
    return { b: s.b.slice(), turn: s.turn, ep: s.ep,
      castle: { wk: s.castle.wk, wq: s.castle.wq, bk: s.castle.bk, bq: s.castle.bq } };
  }

  // 这个格子有没有被 byColor 攻击
  function chAttacked(s, sq, byColor) {
    var x = sq % CH_N, y = Math.floor(sq / CH_N), i, nx, ny, p, dx, dy, g, dirs, low;
    var pd = byColor === 1 ? [[-1, 1], [1, 1]] : [[-1, -1], [1, -1]];
    for (i = 0; i < 2; i++) {
      nx = x + pd[i][0]; ny = y + pd[i][1];
      p = chAt(s, nx, ny);
      if (p && chOwner(p) === byColor && p.toLowerCase() === 'p') return true;
    }
    var kn = [[1, 2], [2, 1], [2, -1], [1, -2], [-1, -2], [-2, -1], [-2, 1], [-1, 2]];
    for (i = 0; i < 8; i++) {
      nx = x + kn[i][0]; ny = y + kn[i][1];
      p = chAt(s, nx, ny);
      if (p && chOwner(p) === byColor && p.toLowerCase() === 'n') return true;
    }
    for (dy = -1; dy <= 1; dy++) for (dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      p = chAt(s, x + dx, y + dy);
      if (p && chOwner(p) === byColor && p.toLowerCase() === 'k') return true;
    }
    dirs = [
      [[1, 0], [-1, 0], [0, 1], [0, -1], 'r'],
      [[1, 1], [1, -1], [-1, 1], [-1, -1], 'b']
    ];
    for (g = 0; g < 2; g++) {

      for (i = 0; i < 4; i++) {
        nx = x + set[i][0]; ny = y + set[i][1];
        while (nx >= 0 && nx < 8 && ny >= 0 && ny < 8) {

      if (low === 'b' || low === 'q') dirs.push([1, 1], [1, -1], [-1, 1], [-1, -1]);
      if (low === 'r' || low === 'q') dirs.push([1, 0], [-1, 0], [0, 1], [0, -1]);

          else { if (chOwner(t) !== own) out.push(chIdx(nx, ny)); break; }
          nx += dirs[i][0]; ny += dirs[i][1];
        }
      }
    } else if (low === 'k') {
      for (dy = -1; dy <= 1; dy++) for (dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        add(x + dx, y + dy);
      }
      // 王车易位
      var homeRow = own === 1 ? 7 : 0;
      if (y === homeRow && x === 4) {
        var kR = own === 1 ? s.castle.wk : s.castle.bk;
        var qR = own === 1 ? s.castle.wq : s.castle.bq;
        var enemy = 3 - own;
        var rookK = s.b[chIdx(7, homeRow)], rookQ = s.b[chIdx(0, homeRow)];

      if (from === 56) s.castle.wq = false;
      if (from === 7) s.castle.bk = false;
      if (from === 0) s.castle.bq = false;

    if (to === 7) s.castle.bk = false;

    },
    status: function (s) {
      if (s.over) {
        var sc = s.score || wqScore(s);
        return (s.win === 1 ? '你赢了' : (s.win === 2 ? 'TA 赢了' : '平局')) + '（' + sc[1] + ' : ' + sc[2] + '）';
      }
      return s.turn === 1 ? '该你下（黑）' : 'TA 正在想…';
    },
    cells: function (s) {
      var out = [], i;
      for (i = 0; i < s.b.length; i++) {
        out.push({ x: i % WG, y: Math.floor(i / WG), cls: s.b[i] === 1 ? 'g-black' : (s.b[i] === 2 ? 'g-white' : ''), txt: '' });
      }
      return out;
    }
  };

  // ===================== 飞行棋（11x11 跑道 + 归巢） =====================
  var FL_N = 11, FL_TRACK = 40, FL_HOME = 44;
  function flTrackPos() {
    // 顺时针一圈：上边(11)、右边(10)、下边(10)、左边(9)
    var p = [], x, y;
    for (x = 0; x < FL_N; x++) p.push([x, 0]);
    for (y = 1; y < FL_N; y++) p.push([FL_N - 1, y]);
    for (x = FL_N - 2; x >= 0; x--) p.push([x, FL_N - 1]);
    for (y = FL_N - 2; y >= 1; y--) p.push([0, y]);
    return p;   // 40 个
  }
  var FL_POS = flTrackPos();
  function flNew() {
    var planes = [], i;
    for (i = 0; i < 4; i++) planes.push({ c: 1, pos: -1 });
    for (i = 0; i < 4; i++) planes.push({ c: 2, pos: -1 });
    return { planes: planes, turn: 1, over: false, win: 0, dice: 0, rolled: false, msg: '掷骰子开始' };
  }
  function flMoves(s, dice) {
    var out = [], i, p;
    for (i = 0; i < s.planes.length; i++) {
      p = s.planes[i];
      if (p.c !== s.turn) continue;
      if (p.pos === FL_HOME) continue;
      if (p.pos < 0) { if (dice === 6) out.push(i); continue; }
      if (p.pos + dice <= FL_HOME) out.push(i);
    }
    return out;
  }
  // 跑道上的绝对格子（各色起点错开 10 格）
  function flAbs(planeIdx, pos) {
    if (pos < 0 || pos >= FL_TRACK) return -1;
    var color = planeIdx < 4 ? 1 : 2;
    var base = color === 1 ? 0 : 20;
    return (pos + base) % FL_TRACK;
  }
  G.flight = {
    id: 'flight', name: '飞行棋', cols: FL_N, rows: FL_N,
    newState: flNew,
    roll: function (s) {
      if (s.over || s.rolled) return 0;
      s.dice = 1 + rnd(6);
      s.rolled = true;
      var mv = flMoves(s, s.dice);
      s.msg = '掷出 ' + s.dice + (mv.length ? '' : '，没有能走的棋');
      return s.dice;
    },
    // 玩家点自己的棋子
    click: function (s, idx) {
      if (s.over || !s.rolled) return false;
      var mv = flMoves(s, s.dice), k;
      for (k = 0; k < mv.length; k++) if (mv[k] === idx) { flApply(s, idx); return true; }
      return false;
    },
    ai: function (s, skill) {
      // 由调用方先 roll
      var mv = flMoves(s, s.dice);
      if (!mv.length) return -1;
      var noise = skillNoise(skill), best = mv[0], bestSc = -1e9, k, pl, sc;
      for (k = 0; k < mv.length; k++) {
        pl = s.planes[mv[k]];
        var land = pl.pos < 0 ? -1 : pl.pos + s.dice;
        var absLand = land >= 0 ? flAbs(mv[k], land) : -1;
        sc = land >= 0 ? land : 4;                    // 起步：能起飞就起飞
        // 撞对手（送他回基地）很赚
        for (var q = 0; q < s.planes.length; q++) {
          var op = s.planes[q];
          if (op.c === 2 || op.pos < 0 || absLand < 0) continue;
          if (absLand === flAbs(q, op.pos)) sc += 60;
        }
        // 落地后别站在对手下一步能踩到的地方（对手要扔到差值）
        if (absLand >= 0) {
          for (var q2 = 0; q2 < s.planes.length; q2++) {
            var op2 = s.planes[q2];
            if (op2.c === 2 || op2.pos < 0) continue;
            var gap = (absLand - flAbs(q2, op2.pos) + FL_TRACK) % FL_TRACK;
            if (gap >= 1 && gap <= 6) sc -= 22;      // 一颗子有 1/6 机会踩到
          }
        }
        if (land === FL_HOME) sc += 60;              // 正好归巢
        else if (land === FL_HOME - 1 && pl.pos === FL_HOME - 2) sc += 8;
        sc += Math.random() * (noise * 6);
        if (sc > bestSc) { bestSc = sc; best = mv[k]; }
      }
      return best;
    },
    applyAI: function (s, planeIdx) { flApply(s, planeIdx); },
    status: function (s) {
      if (s.over) return s.win === 1 ? '你赢了（四架都归巢）' : 'TA 赢了（四架都归巢）';
      return s.msg + (s.turn === 1 ? ' ｜ 轮到你' : ' ｜ TA 的回合');
    },
    cells: function (s) {
      var out = [], i, x, y;
      // 清空 11x11（每格带 pis：这一格上有哪几架飞机，供点击用）
      for (y = 0; y < FL_N; y++) for (x = 0; x < FL_N; x++) out.push({ x: x, y: y, cls: '', txt: '', pis: [] });
      function setCell(x, y, cls, txt) { out[y * FL_N + x] = { x: x, y: y, cls: cls, txt: txt, pis: [] }; }
      // 同一格可以叠多架：累加进去，不能互相覆盖
      function putPlane(x, y, cls, planeIdx) {
        var c = out[y * FL_N + x];
        c.pis.push(planeIdx);
        c.cls = cls;
        c.txt = c.pis.length > 1 ? '●' + c.pis.length : '●';
      }
      // 跑道
      for (i = 0; i < FL_TRACK; i++) {
        var col = (i % 4 === 0) ? 'f-c1' : ((i % 4 === 2) ? 'f-c2' : 'f-track');
        setCell(FL_POS[i][0], FL_POS[i][1], 'f-cell ' + col, '');
      }
      // 中心归巢区
      for (y = 4; y <= 6; y++) for (x = 4; x <= 6; x++) setCell(x, y, 'f-home', '');
      var done = 0;
      for (i = 0; i < s.planes.length; i++) {
        var pl = s.planes[i];
        var cls = pl.c === 1 ? 'f-p1' : 'f-p2';
        if (pl.pos < 0) {
          // 基地：每种颜色四架各占一格
          var n = i % 4, bx, by;
          if (pl.c === 1) { bx = 1 + (n % 2); by = 1 + Math.floor(n / 2); }
          else { bx = 8 + (n % 2); by = 8 + Math.floor(n / 2); }
          putPlane(bx, by, 'f-base ' + cls, i);
          continue;
        }
        if (pl.pos === FL_HOME) { done++; continue; }        // 已归巢，单独统计
        if (pl.pos >= FL_TRACK) {
          // 归巢跑道 4 格
          var k = pl.pos - FL_TRACK;
          putPlane(4 + (k % 3), 4 + (k >= 3 ? 1 : 0), 'f-home ' + cls, i);
          continue;
        }
        var abs = flAbs(i, pl.pos);
        putPlane(FL_POS[abs][0], FL_POS[abs][1], 'f-cell ' + cls, i);
      }
      if (done > 0) setCell(5, 5, 'f-home', '归巢 ' + done);
      return out;
    }
  };
  function flApply(s, planeIdx) {
    var pl = s.planes[planeIdx], d = s.dice;
    pl.pos = pl.pos < 0 ? 0 : pl.pos + d;
    // 撞子：同格对手回基地
    for (var i = 0; i < s.planes.length; i++) {
      var op = s.planes[i];
      if (op.c === pl.c || op.pos < 0 || op.pos >= FL_TRACK) continue;
      if (flAbs(i, op.pos) === flAbs(planeIdx, pl.pos)) op.pos = -1;
    }
    s.rolled = false;
    var allHome = true;
    for (var k = 0; k < s.planes.length; k++) if (s.planes[k].c === pl.c && s.planes[k].pos !== FL_HOME) allHome = false;
    if (allHome) { s.over = true; s.win = pl.c; return; }
    // 掷 6 可以再掷一次
    if (d === 6) { s.msg = '掷出 6，还能再掷一次'; return; }
    s.turn = 3 - s.turn;
    s.msg = '轮到' + (s.turn === 1 ? '你' : ' TA');
  }
  G.flight.moves = flMoves;
  G.flight.home = FL_HOME;
  G.flight.track = FL_TRACK;

  // ===================== 角色棋力 =====================
    G.skill = { rito: 4, yui: 5, yami: 5, nemesis: 5, ren: 4, lala: 3, haruna: 3, mikan: 4, nana: 4, momo: 5, mea: 4, saki: 3, zastin: 5, shizu: 2 };
  G.skillOf = function (id) { return G.skill[id] || 3; };
  G.stars = function (n) {
    var s = '';
    for (var i = 0; i < 5; i++) s += i < n ? '★' : '☆';
    return s;
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = G;
  else root.GAMES = G;
})(this);
</script>
<script>
/* 游戏中心 UI（依赖 GAMES 与主页面的 el/esc/colorFor/AVATARS/contactsData） */
var gCur = 'gomoku', gChar = null, gState = null, gBusy = false, gSnap = [];
var G_SIZE = { gomoku: 28, chess: 40, go: 34, flight: 30 };

function openGames() {
  el('games').style.display = 'block';
  el('gPick').style.display = 'block';
  el('gPlay').style.display = 'none';
  gState = null; gChar = null;
  drawGamePick();
}
function closeGames() { hideResult(); el('games').style.display = 'none'; }

function pickGame(k) {
  gCur = k; gState = null; gChar = null; gBusy = false; gSnap = [];
  var tabs = el('gTabs').children, i, t;
  for (i = 0; i < tabs.length; i++) {
    t = tabs[i];
    t.className = (t.getAttribute('data-g') === k) ? 'gtab on' : 'gtab';
  }
  el('gPick').style.display = 'block';
  el('gPlay').style.display = 'none';
  drawGamePick();
}

function drawGamePick() {
  var box = el('gList'), html = '', i, c, sk, img, av;
  for (i = 0; i < contactsData.length; i++) {
    c = contactsData[i];
    if (c.group) continue;
    sk = GAMES.skillOf(c.id);
    img = AVATARS[c.avatar];
    av = img
      ? '<div class="gAv" style="background-image:url(\'' + img + '\')"></div>'
      : '<div class="gAv" style="background:' + colorFor(c.name) + '">' + esc((c.name || '?').charAt(0)) + '</div>';
    html += '<div class="gItem" onclick="startGame(\'' + c.id + '\')">' + av +
      '<div class="gName">' + esc(c.name) + '</div>' +
      '<div class="gSkill">' + GAMES.stars(sk) + '</div></div>';
  }
  box.innerHTML = html || '<div class="gTip">没有可以邀请的角色</div>';
}

function startGame(id) {
  var i, c = null;
  for (i = 0; i < contactsData.length; i++) if (contactsData[i].id === id) c = contactsData[i];
  if (!c) return;
  gChar = c;
  gState = GAMES[gCur].newState();
  gSnap = []; gBusy = false;
  el('gPick').style.display = 'none';
  el('gPlay').style.display = 'block';
  drawBoard();
  afterMove();
}

function boardCellSize(mod) {
  var wrap = el('gPlay');
  var availW = (wrap ? wrap.clientWidth : 600) - 28;
  var availH = (wrap ? wrap.clientHeight : 560) - 200;
  var byW = Math.floor(availW / mod.cols);
  var byH = Math.floor(availH / mod.rows);
  var s = Math.min(byW, byH);
  var hi = { gomoku: 38, chess: 58, go: 48, flight: 50 }[gCur] || 40;
  var lo = { gomoku: 18, chess: 28, go: 22, flight: 20 }[gCur] || 18;
  if (s > hi) s = hi;
  if (s < lo) s = lo;
  return s;
}

function drawBoard() {
  var mod = GAMES[gCur], size = boardCellSize(mod), cells = mod.cells(gState);
  var board = el('gBoard');
  var isGL = (gCur === 'gomoku' || gCur === 'go');
  var isFlight = (gCur === 'flight');
  var colLast = mod.cols - 1, rowLast = mod.rows - 1;
  var box = size + 'px', fsize = Math.round(size * 0.6) + 'px';
  var html = [], i, c, cls, st, hit;
  board.style.width = (mod.cols * size + 2) + 'px';
  board.style.height = (mod.rows * size + 2) + 'px';
  for (i = 0; i < cells.length; i++) {
    c = cells[i];
    cls = c.cls || '';
    if (isGL) {
      cls += ' gl';
      if (c.x === colLast) cls += ' rowlast';
      if (c.y === rowLast) cls += ' collast';
    }
    st = '';
    if (cls.indexOf('g-black') >= 0) st = '<span class="st"></span>';
    else if (cls.indexOf('g-white') >= 0) st = '<span class="st w"></span>';
    if (isFlight) hit = "'" + ((c.pis && c.pis.length) ? c.pis.join(',') : '') + "'";
    else hit = i;
    html.push('<div class="gc ', cls, '" style="left:', (c.x * size + 1), 'px;top:', (c.y * size + 1),
      'px;width:', box, ';height:', box, ';font-size:', fsize, '" onclick="gCell(', hit, ')">',
      (c.txt ? esc(c.txt) : ''), st, '</div>');
  }
  var out = html.join('');
  if (gCur === 'chess' && gState && !gState.over && GAMES.chess.inCheck(gState)) {
    out += '<div id="gCheckBadge">将军</div>';
  }
  board.innerHTML = out;
  el('gInfo').innerHTML = (gChar ? esc(gChar.name) : '') + ' <span class="gSt">' + GAMES.stars(GAMES.skillOf(gChar ? gChar.id : '')) +
    '</span> ｜ ' + esc(mod.status(gState));
  el('gRoll').style.display = isFlight ? 'inline-block' : 'none';
  el('gPass').style.display = (gCur === 'go') ? 'inline-block' : 'none';
  var again = el('gAgain');
  if (again) again.style.display = (gState && gState.over) ? 'inline-block' : 'none';
  var dice = el('gDice');
  if (dice) {
    if (isFlight && gState && !gState.over) {
      var canRoll = (gState.turn === 1 && !gState.rolled);
      dice.style.display = 'inline-block';
      // 角色回合：骰子一直转（像在掷）；轮到我且还没掷：绿色高亮等点击
      var keepSpin = (String(dice.className).indexOf('spin') >= 0) ? ' spin' : '';
      if (gState.turn === 2) dice.className = 'ai' + keepSpin;
      else dice.className = (canRoll ? 'wait green' : '') + keepSpin;
      dice.title = canRoll ? '点我掷骰子' : (gState.turn === 2 ? '对方正在掷骰子' : '等对方走棋');
      setDiceFace(gState.dice || 0);
    } else {
      dice.style.display = 'none';
      dice.className = '';
    }
  }
}

function gSnapPush() {
  try {
    gSnap.push(JSON.stringify(gState));
    if (gSnap.length > 40) gSnap.shift();
  } catch (e) { }
}

function gCell(i) {
  if (gBusy || !gState || gState.over) return;
  var mod = GAMES[gCur];
  if (gCur === 'flight') {
    if (gState.turn !== 1 || !gState.rolled) return;
    // 这一格可能叠着好几架飞机：按顺序试，能走就走
    var list = String(i).split(','), k2, pi;
    for (k2 = 0; k2 < list.length; k2++) {
      pi = parseInt(list[k2], 10);
      if (isNaN(pi) || pi < 0) continue;
      gSnapPush();
      if (mod.click(gState, pi)) { afterMove(); return; }
      gSnap.pop();
    }
    return;
  }
  var idx = parseInt(i, 10);
  if (isNaN(idx)) return;
  if (gState.turn !== 1) return;
  var beforeLast = gState.last;
  gSnapPush();
  if (mod.click(gState, idx)) {
    // 国际象棋第一次点只是选子，不该占悔棋位，也不用重存快照
    if (gCur === 'chess' && gState.last === beforeLast) gSnap.pop();
    afterMove();
  } else gSnap.pop();
}

function afterMove() {
  drawBoard();
  if (gState.over) { finishGame(); return; }
  if (gCur === 'flight') {
    if (gState.turn === 2) { gBusy = true; setTimeout(aiTurn, 420); }
    return;
  }
  if (gState.turn === 2) { gBusy = true; setTimeout(aiTurn, 380); }
}

function aiTurn() {
  var mod = GAMES[gCur], sk = GAMES.skillOf(gChar.id), mv;
  if (gCur === 'flight') {
    if (!gState.rolled) mod.roll(gState);
    mv = mod.ai(gState, sk);
    if (mv >= 0) mod.applyAI(gState, mv);
    else { gState.rolled = false; gState.turn = 1; }
    drawBoard();
    if (gState.over) { finishGame(); return; }
    if (gState.turn === 2) { setTimeout(aiTurn, 520); return; }
    gBusy = false;
    return;
  }
  if (gCur === 'go') {
    mv = mod.ai(gState, sk);
    if (mv < 0) {
      // 没地方下了：直接数子结算，不能静默“对面不动了”
      mod.finish(gState);
      drawBoard();
      finishGame();
      return;
    }
    mod.click(gState, mv);
  } else if (gCur === 'chess') {
    mv = mod.ai(gState, sk);
    if (mv && !mod.apply(gState, mv[0], mv[1])) {
      // 兜底：AI 的着法被拒时换一个合法着法，绝不把局面卡成“TA 一直想…”
      var alt = mod.legalFor(gState, 2);
      if (alt && alt.length) mod.apply(gState, alt[0][0], alt[0][1]);
      else { gState.over = true; gState.win = 1; }
    } else if (!mv) { gState.over = true; gState.win = 1; }
    // 再兜一次：轮到 AI 却还没换手，说明卡住了，直接把回合交回玩家
    if (!gState.over && gState.turn === 2) {
      var alt2 = mod.legalFor(gState, 2);
      if (alt2 && alt2.length) mod.apply(gState, alt2[0][0], alt2[0][1]);
      if (gState.turn === 2) { gState.over = true; gState.win = 1; gState.end = 'stuck'; }
    }
  } else {
    mv = mod.ai(gState, sk);
    if (mv >= 0) mod.click(gState, mv);
  }
  drawBoard();
  if (gState.over) { finishGame(); return; }
  gBusy = false;
  if (gCur === 'flight' && gState.turn === 2) { setTimeout(aiTurn, 320); }
}

function finishGame() {
  gBusy = false; gSnap = [];
  drawBoard();
  var t = GAMES[gCur].status(gState);
  showToast(t);
  showResult(gState.win === 1 ? 'win' : (gState.win === 2 ? 'lose' : 'draw'));
  try { if (gChar) window.external.GameResult(gChar.id, GAMES[gCur].name, gState.win); } catch (e) { }
  setTimeout(function () { try { postGameInvite(); } catch (e) { } }, 2600);
}

// 终局大字：赢=红 WIN!、输=灰 LOSE、平=黑 平局
function showResult(kind) {
  var box = el('gResult'), txt = el('gResultText');
  if (!box || !txt) return;
  txt.innerHTML = kind === 'win' ? 'WIN!' : (kind === 'lose' ? 'LOSE' : '平局');
  box.className = (kind === 'win' ? 'red' : (kind === 'lose' ? 'gray' : 'black'));
  box.style.display = 'block';
  setTimeout(function () { if (box.className.indexOf('show') < 0) box.className += ' show'; }, 20);
}

function hideResult() {
  var box = el('gResult'), txt = el('gResultText');
  if (box) { box.className = ''; box.style.display = 'none'; }
  if (txt) txt.innerHTML = '';
}

// 骰子面：按点数摆小圆点
var DICE_PIPS = {
  1: [[1, 1]],
  2: [[0, 0], [2, 2]],
  3: [[0, 0], [1, 1], [2, 2]],
  4: [[0, 0], [2, 0], [0, 2], [2, 2]],
  5: [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]],
  6: [[0, 0], [2, 0], [0, 1], [2, 1], [0, 2], [2, 2]]
};
function setDiceFace(v) {
  var d = el('gDice');
  if (!d) return;
  var pts = DICE_PIPS[v] || [], html = '', k;
  for (k = 0; k < pts.length; k++) {
    html += '<i class="pip" style="left:' + (8 + pts[k][0] * 19) + 'px;top:' + (8 + pts[k][1] * 19) + 'px"></i>';
  }
  if (!pts.length) html = '<span class="dnum">?</span>';
  d.innerHTML = html;
}
// 点一下骰子转一圈（重新触发动画）
function spinDice() {
  var d = el('gDice');
  if (!d) return;
  d.style.animation = 'none';
  var w = d.offsetWidth;          // 强制重排，动画才能重新开始
  d.style.animation = '';
  if (d.className.indexOf('spin') < 0) d.className = (d.className + ' spin').replace(/^\s+/, '');
  setTimeout(function () {
    var e2 = el('gDice');
    if (e2) e2.className = e2.className.replace(/\s*spin\b/g, '').replace(/^\s+/, '');
  }, 520);
}
function gRoll() {
  if (gCur !== 'flight' || !gState || gState.over || gState.turn !== 1) return;
  if (gState.rolled) return;
  spinDice();                       // 骰子转一圈
  var d = GAMES.flight.roll(gState);
  if (!d) return;
  var mv = GAMES.flight.moves(gState, gState.dice);
  if (!mv.length) {
    // 没有能走的棋：这一掷作废，直接交给对方，别卡在“轮到你”却动不了
    gState.rolled = false;
    gState.turn = 2;
    gState.msg = '掷出 ' + gState.dice + '，没有能走的棋';
    afterMove();
    return;
  }
  drawBoard();
}

function gPass() {
  if (gCur !== 'go' || !gState || gState.over || gState.turn !== 1) return;
  gSnapPush();
  GAMES.go.pass(gState);
  afterMove();
}

function gUndo() {
  if (!gState || gBusy) return;
  if (!gSnap.length) { showToast('没有可悔的棋'); return; }
  var s = gSnap.pop();
  try { gState = JSON.parse(s); } catch (e) { return; }
  gBusy = false;
  drawBoard();
}

function gRestart() {
  if (!gChar) return;
  gState = GAMES[gCur].newState();
  gSnap = []; gBusy = false;
  drawBoard();
  afterMove();
}

// 仅供预览/调试：摆一个特定局面
function gDemo(mode) {
  if (!gState) return;
  if (mode === 'check') {
    var b = [], i;
    for (i = 0; i < 64; i++) b.push('');
    b[60] = 'K'; b[4] = 'k'; b[20] = 'r';   // 白王 e1 被黑车 e4 照着
    gState.b = b; gState.turn = 1; gState.over = false; gState.last = 20;
    drawBoard();
  } else if (mode === 'dice') {
    if (gCur === 'flight' && gState) {
      gState.rolled = true; gState.dice = 5; gState.turn = 1;
      drawBoard();
    }
  } else if (mode === 'over') {
    gState.over = true; gState.win = 2; gState.end = 'checkmate';
    drawBoard();
  } else if (mode === 'win') {
    gState.over = true; gState.win = 1; gState.end = 'checkmate';
    drawBoard();
    showResult('win');
  }
}
function gAgain() {
  if (!gState || !gState.over || !gChar) return;
  hideResult();
  hideInvite();
  startGame(gChar.id);      // 同一个对手、同一个棋种，再来一局
}
function gGiveUp() {
  if (!gState || gState.over) return;
  if (!confirm('确定要认输吗？')) return;
  if (gCur === 'go') { GAMES.go.resign(gState, 1); }
  else { gState.over = true; gState.win = 2; }
  gBusy = false;
  drawBoard();
  showToast('你认输了，' + (gChar ? gChar.name : 'TA') + ' 赢了');
  showResult('lose');
}
function gBack() {
  gState = null; gChar = null; gBusy = false;
  el('gPlay').style.display = 'none';
  el('gPick').style.display = 'block';
  drawGamePick();
}

</script>
<script>
/* 棋局边聊天：两侧头像 + 冒气泡 */
var gBubTimers = {};
var gBubIds = ['gBubMe', 'gBubOpp'];

function gHideBub(id) {
  var b = el(id);
  if (b) { b.className = 'gBub'; }
  if (gBubTimers[id]) { clearTimeout(gBubTimers[id]); gBubTimers[id] = null; }
}

function gShowBub(id, text, extraCls) {
  var b = el(id);
  if (!b) return;
  b.innerHTML = esc(text);
  b.className = 'gBub on' + (extraCls ? ' ' + extraCls : '');
  if (gBubTimers[id]) clearTimeout(gBubTimers[id]);
  gBubTimers[id] = setTimeout(function () { b.className = 'gBub'; }, 8000);
}

function gSetupSides() {
  var me = el('gAvaMe'), op = el('gAvaOpp'), img;
  if (me) { me.innerHTML = '条'; me.style.backgroundImage = ''; me.style.background = '#3E9E6A'; }
  if (op && gChar) {
    img = AVATARS[gChar.avatar];
    if (img) {
      op.style.backgroundImage = 'url(\'' + img + '\')';
      op.style.backgroundColor = 'transparent';
      op.innerHTML = '';
    } else {
      op.style.backgroundImage = '';
      op.style.background = colorFor(gChar.name);
      op.innerHTML = esc((gChar.name || '?').charAt(0));
    }
  }
  for (var i = 0; i < gBubIds.length; i++) gHideBub(gBubIds[i]);
}

// 这一局是不是还没走过子（用来判断“开局”）
function gHasMoved() {
  if (!gState) return false;
  var i;
  if (gCur === 'flight') {
    for (i = 0; i < gState.planes.length; i++) if (gState.planes[i].pos >= 0) return true;
    return false;
  }
  return (gState.last !== undefined && gState.last >= 0);
}

function gSaySend() {
  if (!gChar || !gState) return;
  var inp = el('gSay'), t = inp ? inp.value : '';
  if (!t || !t.replace(/\s/g, '')) return;
  inp.value = '';
  gShowBub('gBubMe', t);
  // 开局第一句里带“你先”，就把先手让给对手
  if (!gHasMoved() && t.indexOf('你先') >= 0) {
    if (gFirst !== 'opp' && !gState.over) {
      gFirst = 'opp';
      gState.turn = 2;
      if (gState.rolled !== undefined) gState.rolled = false;
      drawBoard();
      afterMove();
      showToast('好，让 ' + gChar.name + ' 先手');
    } else {
      showToast(gChar.name + ' 已经是先手了');
    }
  }
  gShowBub('gBubOpp', '正在打字…', 'typing');
  try { window.external.GameChat(gChar.id, t, GAMES[gCur].name); }
  catch (e) { gHideBub('gBubOpp'); }
}

function gSayKey(ev) {
  ev = ev || window.event;
  if (!ev) return;
  if ((ev.keyCode || ev.which) === 13) { gSaySend(); return false; }
  return true;
}

function gameReply(name, text) {
  if (!gState) return;
  gShowBub('gBubOpp', text);
}

// 开始/重开/换人后重新布置两侧头像
var gFirst = 'me';
var _startGameBase = startGame;
startGame = function (id, forceFirst) {
  hideResult();
  _startGameBase(id);
  gSetupSides();
  gDecideFirst(forceFirst);
};

// 先后手随机抽取（forceFirst: 'me' / 'opp'，仅预览用）
function gDecideFirst(force) {
  var oppFirst;
  if (force === 'opp') oppFirst = true;
  else if (force === 'me') oppFirst = false;
  else oppFirst = Math.random() < 0.5;
  gFirst = oppFirst ? 'opp' : 'me';
  if (gState && !gState.over && oppFirst) {
    gState.turn = 2;
    if (gState.rolled !== undefined) gState.rolled = false;
    drawBoard();
    afterMove();
    if (gChar && showToast) showToast('这次 ' + gChar.name + ' 先手');
  } else {
    drawBoard();
  }
}

var _drawBoardBase = drawBoard;
drawBoard = function () {
  _drawBoardBase();
  var info = el('gInfo');
  if (info && gState && !gState.over) {
    info.innerHTML = info.innerHTML + '<span class="gFirst">' +
      (gFirst === 'opp' ? '（' + esc(gChar ? gChar.name : 'TA') + ' 先手）' : '（你先手）') + '</span>';
  }
};

var _gRestartBase = gRestart;
gRestart = function () {
  hideResult();
  _gRestartBase();
  gDecideFirst();
};

function gResize() {
  if (!gState) return;
  if (el('games') && el('games').style.display !== 'block') return;
  try { drawBoard(); } catch (e) { }
}
if (window.addEventListener) window.addEventListener('resize', gResize, false);
else if (window.attachEvent) window.attachEvent('onresize', gResize);

var _gBackBase = gBack;
gBack = function () {
  hideResult();
  _gBackBase();
  for (var i = 0; i < gBubIds.length; i++) gHideBub(gBubIds[i]);
};

</script>
<script>
/* 对局邀请：赛后再邀 + 平时随机邀请 */
var gInviteChar = null, gInviteGame = null;
var gInviteChance = 0.45;      // 对局结束后再邀的概率
var gIdleInviteChance = 0.05;  // 每分钟被随机邀请的概率

function gameNameOf(key) { return GAMES[key] ? GAMES[key].name : '棋'; }

function showInvite(charId, gameKey, text) {
  var c = null, i;
  for (i = 0; i < contactsData.length; i++) if (contactsData[i].id === charId) c = contactsData[i];
  if (!c) return false;
  gInviteChar = c; gInviteGame = gameKey;
  var av = el('gInvAva');
  if (av) {
    var img = AVATARS[c.avatar];
    if (img) {
      av.style.backgroundImage = 'url(\'' + img + '\')';
      av.innerHTML = '';
    } else {
      av.style.backgroundImage = '';
      av.style.backgroundColor = colorFor(c.name);
      av.innerHTML = esc((c.name || '?').charAt(0));
    }
  }
  if (el('gInvName')) el('gInvName').innerHTML = esc(c.name);
  if (el('gInvText')) el('gInvText').innerHTML = esc(text);
  if (el('gInvite')) el('gInvite').style.display = 'block';
  return true;
}

function hideInvite() {
  if (el('gInvite')) el('gInvite').style.display = 'none';
  gInviteChar = null; gInviteGame = null;
}

function acceptInvite() {
  var c = gInviteChar, g = gInviteGame;
  hideInvite();
  if (!c || !g) return;
  openGames();
  pickGame(g);
  startGame(c.id);
}

function declineInvite() {
  var c = gInviteChar;
  hideInvite();
  if (c) showToast(c.name + '：那下次吧');
}

// 一局结束后，有时会再邀一局
function postGameInvite() {
  if (!gChar || !gState || !gState.over) return;
  if (Math.random() > gInviteChance) return;
  var win = gState.win;
  var text = win === 1 ? '这局算你运气好……要不再来一局？'
    : (win === 2 ? '服不服？再来一局？'
      : '又是平局，再来分个高下？');
  showInvite(gChar.id, gCur, text);
}

// 平时随机有人来邀请
function idleInvite() {
  if (gInviteChar) return;
  if (el('games') && el('games').style.display === 'block') return;
  if (Math.random() > gIdleInviteChance) return;
  var pool = [], i;
  for (i = 0; i < contactsData.length; i++) if (!contactsData[i].group) pool.push(contactsData[i]);
  if (!pool.length) return;
  var c = pool[Math.floor(Math.random() * pool.length)];
  var keys = ['gomoku', 'chess', 'go', 'flight'];
  var g = keys[Math.floor(Math.random() * keys.length)];
  showInvite(c.id, g, '闲着也是闲着，来一局' + gameNameOf(g) + '？');
}

setInterval(function () { try { idleInvite(); } catch (e) { } }, 60000);

</script>
