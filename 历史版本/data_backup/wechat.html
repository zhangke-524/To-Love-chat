<!DOCTYPE html>
<html>
<head>
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta charset="utf-8" />
<style>
html, body { margin:0; height:100%; font-family:"Microsoft YaHei","微软雅黑",sans-serif; background:#EDEDED; overflow:hidden; }
#app { position:relative; height:100%; }
#topbar { position:absolute; top:0; left:0; right:0; height:56px; background:#EDEDED; border-bottom:1px solid #D7D7D7; z-index:5; }
.tb-title { position:absolute; left:0; right:0; top:7px; text-align:center; }
.tb-title .name { font-size:16px; color:#111; font-weight:bold; }
.tb-title .status { font-size:11px; color:#999; margin-top:2px; }
.back { position:absolute; left:14px; top:10px; font-size:26px; color:#333; }
.mem-btn { position:absolute; right:14px; top:16px; font-size:13px; color:#07C160; cursor:pointer; }
#chat { position:absolute; top:57px; bottom:64px; left:0; right:0; overflow-y:auto; overflow-x:hidden; padding:6px 0 10px 0; -ms-overflow-style:none; }
.row { margin:9px 14px; overflow:hidden; clear:both; }
.avatar { width:38px; height:38px; border-radius:4px; color:#fff; text-align:center; line-height:38px; font-size:16px; background-size:cover; background-position:50% 25%; background-repeat:no-repeat; }
.left .avatar { float:left; background:#6E7F8D; }
.right .avatar { float:right; background:#3E9E6A; }
.bwrap { max-width:62%; }
.left .bwrap { float:left; margin-left:8px; }
.right .bwrap { float:right; margin-right:8px; }
.bubble { padding:9px 12px; border-radius:5px; font-size:14px; line-height:1.55; word-wrap:break-word; white-space:pre-wrap; color:#111; }
.him { background:#FFFFFF; }
.me { background:#95EC69; }
.time { text-align:center; font-size:11px; color:#B2B2B2; margin:10px 0 2px 0; }
#typing { position:absolute; left:20px; bottom:70px; font-size:12px; color:#999; display:none; z-index:6; }
#inputbar { position:absolute; bottom:0; left:0; right:0; height:64px; background:#F7F7F7; border-top:1px solid #D7D7D7; z-index:5; }
#input { position:absolute; left:12px; top:10px; width:82%; height:40px; border:1px solid #E2E2E2; border-radius:4px; padding:8px 10px; font-size:14px; font-family:"Microsoft YaHei",sans-serif; resize:none; outline:none; background:#fff; overflow:hidden; }
#sendBtn { position:absolute; right:12px; top:10px; width:72px; height:42px; background:#07C160; color:#fff; border:none; border-radius:4px; font-size:14px; cursor:pointer; }
#sendBtn.disabled { background:#A8E3C2; }
#panel { position:absolute; top:0; right:0; width:330px; height:100%; background:#fff; box-shadow:-2px 0 10px rgba(0,0,0,.15); z-index:30; display:none; }
#panel.open { display:block; }
.panel-head { height:56px; line-height:56px; padding:0 14px; border-bottom:1px solid #EDEDED; font-size:15px; color:#111; font-weight:bold; }
.panel-head .close { float:right; color:#999; cursor:pointer; font-size:20px; line-height:56px; }
.mem-list { position:absolute; top:57px; bottom:0; left:0; right:0; overflow-y:auto; padding:10px; }
.mem-item { border:1px solid #EFEFEF; border-radius:6px; padding:10px; margin-bottom:9px; background:#FAFAFA; }
.mem-top { font-size:11px; margin-bottom:5px; }
.tag { display:inline-block; padding:1px 6px; border-radius:3px; color:#fff; font-size:10px; margin-right:6px; }
.tag.normal { background:#9AA5B1; }
.tag.important { background:#F2A33C; }
.tag.super { background:#E05A5A; }
.exp { color:#B2B2B2; }
.mem-text { font-size:13px; color:#333; line-height:1.5; }
.mem-del { float:right; font-size:11px; color:#C9C9C9; cursor:pointer; }
.overlay { position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.35); z-index:50; display:none; }
.dialog { position:absolute; width:300px; left:50%; margin-left:-150px; top:180px; background:#fff; border-radius:8px; padding:20px; text-align:center; }
.dlg-title { font-size:15px; color:#111; font-weight:bold; margin-bottom:10px; }
.dlg-text { font-size:13px; color:#555; line-height:1.6; margin-bottom:16px; word-wrap:break-word; }
.dlg-btns button { width:110px; height:36px; border:none; border-radius:5px; font-size:14px; cursor:pointer; margin:0 6px; }
.btn-gray { background:#F2F2F2; color:#555; }
.btn-green { background:#07C160; color:#fff; }
#toast { position:absolute; left:50%; margin-left:-90px; bottom:120px; width:180px; text-align:center; background:rgba(0,0,0,.72); color:#fff; font-size:12px; padding:8px 0; border-radius:5px; display:none; z-index:60; }
</style>
</head>

<div id="app">
  <div id="topbar">
    <div class="back">&#8249;</div>
    <div class="tb-title"><div class="name">结城梨斗</div><div class="status" id="status">在线</div></div>

  </div>
  <div id="chat"></div>
  <div id="typing">对方正在输入…</div>
  <div id="inputbar">
    <textarea id="input" placeholder=""></textarea>
    <button id="sendBtn" onclick="doSend()">发送</button>
  </div>
  <div id="panel">
    <div class="panel-head">记忆库<span class="close" onclick="togglePanel()">&#215;</span></div>
    <div class="mem-list" id="memList"></div>
  </div>
  <div class="overlay" id="overlay">
    <div class="dialog">
      <div class="dlg-title">要永久记住这件事吗？</div>
      <div class="dlg-text" id="dlgText"></div>
      <div class="dlg-btns">
        <button class="btn-gray" onclick="confirmNo()">算了</button>
        <button class="btn-green" onclick="confirmYes()">记住</button>
      </div>
    </div>
  </div>
  <div id="toast"></div>
</div>

function loadRitoAvatar(el){
  el.style.backgroundImage = "url('" + RITO_AVATAR + "')";
  el.style.backgroundSize = "cover";
  el.style.backgroundPosition = "50% 20%";
  el.style.backgroundRepeat = "no-repeat";
  el.innerText = "";
}
var memData = [];
var busy = false;

function el(id){ return document.getElementById(id); }

function addMessage(role, text){
  var chat = el('chat');
  var row = document.createElement('div');
  row.className = 'row ' + (role === 'user' ? 'right' : 'left');
  var av = document.createElement('div');
  av.className = 'avatar ' + (role === 'user' ? 'av-me' : 'av-him');
  av.innerText = role === 'user' ? '条' : '梨';
  if (role !== 'user') loadRitoAvatar(av);
  var wrap = document.createElement('div');
  wrap.className = 'bwrap';
  var b = document.createElement('div');
  b.className = 'bubble ' + (role === 'user' ? 'me' : 'him');
  b.innerText = text;
  wrap.appendChild(b);
  row.appendChild(av);
  row.appendChild(wrap);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function addTime(t){
  var chat = el('chat');
  var d = document.createElement('div');
  d.className = 'time';
  d.innerText = t;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function clearChat(){ el('chat').innerHTML = ''; }

function setTyping(on){
  el('typing').style.display = on ? 'block' : 'none';
  if (on) { var c = el('chat'); c.scrollTop = c.scrollHeight; }
}

function setBusy(on){
  busy = on;
  el('sendBtn').className = on ? 'disabled' : '';
  el('sendBtn').disabled = on;
}

function setInput(t){ el('input').value = t; doSend(); }

function doSend(){
  if (busy) return;
  var t = el('input').value;
  if (!t || !t.replace(/\s/g,'')) return;
  el('input').value = '';
  addMessage('user', t);
  window.external.Send(t);
}

function onEnter(e){
  if (e.keyCode === 13 && !e.shiftKey) { e.preventDefault(); doSend(); }
}

function togglePanel(){
  var p = el('panel');
  p.className = (p.className === 'panel open') ? 'panel' : 'panel open';
  if (p.className === 'panel open') window.external.RefreshMemories();
}

function renderMemories(json){
  memData = JSON.parse(json || '[]');
  var list = el('memList');
  list.innerHTML = '';
  if (!memData.length) { list.innerHTML = '<div style="color:#B2B2B2;font-size:12px;text-align:center;padding:30px 0;">还没有记忆</div>'; return; }
  for (var i = 0; i < memData.length; i++) {
    var m = memData[i];
    var d = document.createElement('div');
    d.className = 'mem-item';
    var left = (m.expires && m.expires > 0) ? ('还剩 ' + Math.max(0, Math.ceil((m.expires - Date.now()) / 86400000)) + ' 天') : '永久';
    d.innerHTML = '<div class="mem-top"><span class="tag ' + m.tier + '">' + tierName(m.tier) + '</span><span class="exp">' + left + '</span><span class="mem-del" onclick="delMem(\'' + m.id + '\')">删除</span></div><div class="mem-text"></div>';
    d.getElementsByClassName('mem-text')[0].innerText = m.text;
    list.appendChild(d);
  }
}

function tierName(t){
  if (t === 'super') return '超级重要';
  if (t === 'important') return '重要';
  return '普通';
}

function delMem(id){ if (confirm('删除这条记忆？')) window.external.DeleteMemory(id); }

function showConfirm(id, text){
  pendingId = id;
  el('dlgText').innerText = text;
  el('overlay').style.display = 'block';
}

function confirmYes(){ el('overlay').style.display = 'none'; if (pendingId) window.external.ConfirmSuper(pendingId, true); pendingId = null; }
function confirmNo(){ el('overlay').style.display = 'none'; if (pendingId) window.external.ConfirmSuper(pendingId, false); pendingId = null; }

function showToast(t){
  var x = el('toast');
  x.innerText = t;
  x.style.display = 'block';
  setTimeout(function(){ x.style.display = 'none'; }, 1800);
}

function setStatus(t){ el('status').innerText = t; }
</script>
